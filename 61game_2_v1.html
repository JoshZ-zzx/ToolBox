<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>六一知识小火箭</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      background: #071941;
      color: #fff;
    }

    #game {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(circle at 16% 18%, rgba(255,255,255,.95) 0 2px, transparent 3px),
        radial-gradient(circle at 32% 32%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        radial-gradient(circle at 68% 20%, rgba(255,255,255,.9) 0 2px, transparent 3px),
        radial-gradient(circle at 84% 38%, rgba(255,255,255,.75) 0 2px, transparent 3px),
        radial-gradient(circle at 58% 62%, rgba(255,255,255,.8) 0 2px, transparent 3px),
        linear-gradient(180deg, #071941 0%, #152e72 48%, #4c65d9 100%);
    }

    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
    }

    .star {
      position: absolute;
      color: rgba(255,255,255,.8);
      animation: twinkle 2.4s ease-in-out infinite;
      text-shadow: 0 0 10px rgba(255,255,255,.7);
    }

    @keyframes twinkle {
      0%, 100% { opacity: .35; transform: scale(.85); }
      50% { opacity: 1; transform: scale(1.2); }
    }

    .moon {
      position: absolute;
      right: 7vw;
      top: 8vh;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #fff5b8;
      box-shadow: 0 0 42px rgba(255,245,184,.45);
      z-index: 1;
    }

    .moon::after {
      content: "";
      position: absolute;
      right: 26px;
      top: 18px;
      width: 105px;
      height: 105px;
      border-radius: 50%;
      background: #071941;
    }

    .planet {
      position: absolute;
      border-radius: 50%;
      opacity: .55;
      filter: blur(.1px);
      z-index: 1;
    }

    .planet.one {
      left: -42px;
      bottom: 130px;
      width: 145px;
      height: 145px;
      background: linear-gradient(135deg, #ffb257, #ff6f91);
      box-shadow: inset -18px -20px 0 rgba(0,0,0,.12);
    }

    .planet.two {
      right: -54px;
      bottom: 40px;
      width: 180px;
      height: 180px;
      background: linear-gradient(135deg, #6fffe0, #4a9dff);
      box-shadow: inset -24px -24px 0 rgba(0,0,0,.12);
    }

    .hud {
      position: absolute;
      top: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1220px, calc(100vw - 40px));
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 18px;
      align-items: center;
      z-index: 10;
    }

    .panel {
      background: rgba(255,255,255,.92);
      color: #15366c;
      border: 5px solid rgba(255,255,255,.96);
      border-radius: 28px;
      padding: 12px 22px;
      box-shadow: 0 10px 0 rgba(0,0,0,.16), 0 16px 28px rgba(0,0,0,.18);
      font-weight: 900;
      text-align: center;
      font-size: clamp(21px, 2.1vw, 34px);
      white-space: nowrap;
    }

    .title-panel {
      color: #ff5f8f;
      text-shadow: 0 3px 0 #fff1a8;
      font-size: clamp(30px, 3vw, 48px);
      letter-spacing: 2px;
      padding: 12px 34px;
    }

    #mainStage {
      position: absolute;
      inset: 0;
      z-index: 5;
    }

    .question-card {
      position: absolute;
      left: 50%;
      top: 20vh;
      transform: translateX(-50%);
      width: min(980px, calc(100vw - 80px));
      min-height: 190px;
      background: rgba(255,255,255,.95);
      color: #16386d;
      border: 8px solid #fff;
      border-radius: 42px;
      box-shadow: 0 16px 0 rgba(0,0,0,.17), 0 22px 42px rgba(0,0,0,.22);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 34px 44px;
      font-size: clamp(36px, 4.6vw, 72px);
      font-weight: 900;
      line-height: 1.2;
      z-index: 8;
    }

    .question-card::before {
      content: "✨";
      position: absolute;
      left: 24px;
      top: 18px;
      font-size: 42px;
    }

    .question-card::after {
      content: "✨";
      position: absolute;
      right: 24px;
      bottom: 18px;
      font-size: 42px;
    }

    #feedback {
      position: absolute;
      left: 50%;
      top: calc(20vh + 210px);
      transform: translateX(-50%);
      min-height: 62px;
      z-index: 12;
      font-size: clamp(28px, 3.5vw, 54px);
      font-weight: 900;
      color: #fff45d;
      text-shadow: 0 4px 0 #17316a, 0 10px 22px rgba(0,0,0,.32);
      text-align: center;
      pointer-events: none;
      opacity: 0;
    }

    #feedback.show {
      animation: feedbackPop 1.1s ease forwards;
    }

    @keyframes feedbackPop {
      0% { opacity: 0; transform: translateX(-50%) scale(.75); }
      18% { opacity: 1; transform: translateX(-50%) scale(1.15); }
      80% { opacity: 1; transform: translateX(-50%) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) scale(1); }
    }

    .answers {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      width: min(1180px, calc(100vw - 48px));
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
      z-index: 10;
    }

    .answer-btn {
      min-height: 150px;
      border: 0;
      cursor: pointer;
      border-radius: 42px;
      background: linear-gradient(180deg, #fff9cf, #ffcd5b);
      color: #17366c;
      box-shadow: 0 12px 0 #d78a18, 0 18px 28px rgba(0,0,0,.25);
      font-family: inherit;
      font-size: clamp(30px, 4vw, 62px);
      font-weight: 900;
      padding: 20px 18px;
      transition: transform .12s ease, box-shadow .12s ease, filter .12s ease;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .answer-btn::before {
      content: "";
      position: absolute;
      left: 18%;
      top: 10%;
      width: 28%;
      height: 18%;
      border-radius: 50%;
      background: rgba(255,255,255,.45);
      transform: rotate(-12deg);
    }

    .answer-btn:nth-child(2) {
      background: linear-gradient(180deg, #d8fff4, #55e6c1);
      box-shadow: 0 12px 0 #13a884, 0 18px 28px rgba(0,0,0,.25);
    }

    .answer-btn:nth-child(3) {
      background: linear-gradient(180deg, #ffe0f2, #ff82ba);
      box-shadow: 0 12px 0 #d44982, 0 18px 28px rgba(0,0,0,.25);
    }

    .answer-btn:hover:not(:disabled) {
      transform: translateY(-3px);
      filter: brightness(1.03);
    }

    .answer-btn:active:not(:disabled) {
      transform: translateY(8px);
      box-shadow: 0 4px 0 #d78a18, 0 10px 18px rgba(0,0,0,.22);
    }

    .answer-btn:disabled {
      cursor: default;
      filter: saturate(.8);
    }

    .answer-btn.correct {
      animation: correctPulse .55s ease;
      outline: 8px solid #76ff7a;
    }

    .answer-btn.wrong {
      animation: wrongShake .42s ease;
      outline: 8px solid #ff4d6d;
    }

    .key-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 16px;
      color: #fff;
      background: rgba(21,54,108,.9);
      font-size: clamp(24px, 2.5vw, 36px);
      box-shadow: inset 0 -4px 0 rgba(0,0,0,.18);
    }

    .answer-text {
      position: relative;
      z-index: 1;
      text-align: center;
    }

    @keyframes correctPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    @keyframes wrongShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-10px); }
      40% { transform: translateX(10px); }
      60% { transform: translateX(-8px); }
      80% { transform: translateX(8px); }
    }

    #rocketWrap {
      position: absolute;
      left: 7vw;
      bottom: 64px;
      width: 130px;
      height: 230px;
      z-index: 7;
      transform: translateY(0);
      transition: transform .75s cubic-bezier(.2, 1.25, .35, 1);
    }

    #rocketWrap.shake {
      animation: rocketShake .42s ease;
    }

    @keyframes rocketShake {
      0%, 100% { margin-left: 0; }
      20% { margin-left: -10px; }
      40% { margin-left: 10px; }
      60% { margin-left: -8px; }
      80% { margin-left: 8px; }
    }

    .rocket {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 92px;
      height: 170px;
      filter: drop-shadow(0 12px 0 rgba(0,0,0,.18));
    }

    .rocket-body {
      position: absolute;
      left: 21px;
      top: 18px;
      width: 50px;
      height: 112px;
      border-radius: 50% 50% 24px 24px;
      background: linear-gradient(90deg, #f8fbff, #b9d7ff);
      border: 5px solid #24447d;
      z-index: 2;
    }

    .rocket-nose {
      position: absolute;
      left: 27px;
      top: 0;
      width: 38px;
      height: 42px;
      background: #ff5f8f;
      border: 5px solid #24447d;
      border-bottom: 0;
      border-radius: 36px 36px 8px 8px;
      z-index: 3;
    }

    .window {
      position: absolute;
      left: 31px;
      top: 48px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #6fffe0;
      border: 5px solid #24447d;
      z-index: 4;
      box-shadow: inset -4px -4px 0 rgba(0,0,0,.12);
    }

    .fin {
      position: absolute;
      bottom: 36px;
      width: 34px;
      height: 48px;
      background: #ffd256;
      border: 5px solid #24447d;
      z-index: 1;
    }

    .fin.left {
      left: 2px;
      border-radius: 24px 6px 12px 24px;
      transform: rotate(-16deg);
    }

    .fin.right {
      right: 2px;
      border-radius: 6px 24px 24px 12px;
      transform: rotate(16deg);
    }

    .flame {
      position: absolute;
      left: 31px;
      top: 124px;
      width: 30px;
      height: 72px;
      border-radius: 0 0 26px 26px;
      background: linear-gradient(#fff15e, #ff8c2a, #ff3b5f);
      animation: flame 0.18s ease-in-out infinite alternate;
      z-index: 0;
      transform-origin: top center;
    }

    @keyframes flame {
      from { transform: scaleY(.84); opacity: .88; }
      to { transform: scaleY(1.16); opacity: 1; }
    }

    .trail-star {
      position: absolute;
      pointer-events: none;
      z-index: 13;
      font-size: 32px;
      animation: trailStar .8s ease forwards;
    }

    @keyframes trailStar {
      0% { opacity: 1; transform: translateY(0) scale(.6) rotate(0deg); }
      100% { opacity: 0; transform: translateY(90px) scale(1.4) rotate(180deg); }
    }

    .screen {
      position: absolute;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(3, 14, 44, .58);
      backdrop-filter: blur(4px);
    }

    .card {
      width: min(900px, calc(100vw - 48px));
      background: rgba(255,255,255,.96);
      color: #16386d;
      border: 8px solid #fff;
      border-radius: 48px;
      box-shadow: 0 20px 0 rgba(0,0,0,.18), 0 28px 54px rgba(0,0,0,.28);
      padding: clamp(28px, 4vw, 56px);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .card::before {
      content: "🚀";
      position: absolute;
      left: 28px;
      top: 24px;
      font-size: 70px;
      animation: float 2.5s ease-in-out infinite;
    }

    .card::after {
      content: "🌟";
      position: absolute;
      right: 32px;
      top: 30px;
      font-size: 64px;
      animation: float 2.7s ease-in-out infinite .4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }

    .big-title {
      margin: 8px 0 18px;
      font-size: clamp(44px, 6vw, 82px);
      line-height: 1.1;
      color: #ff5f8f;
      text-shadow: 0 5px 0 #fff1a8, 0 10px 16px rgba(255,95,143,.22);
    }

    .subtitle {
      margin: 10px auto 28px;
      max-width: 700px;
      font-size: clamp(22px, 2.4vw, 34px);
      font-weight: 900;
      line-height: 1.55;
    }

    .tip {
      display: inline-block;
      margin: 8px 0 26px;
      padding: 14px 22px;
      background: #fff7c8;
      border: 4px dashed #ffc83d;
      border-radius: 24px;
      font-size: clamp(20px, 2.2vw, 30px);
      font-weight: 900;
      color: #7a4b00;
    }

    .button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(#ff7ba3, #ff4e82);
      color: #fff;
      font-family: inherit;
      font-size: clamp(26px, 3vw, 44px);
      font-weight: 900;
      padding: 18px 50px;
      cursor: pointer;
      box-shadow: 0 10px 0 #cb2e5d, 0 16px 25px rgba(203,46,93,.32);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 0 #cb2e5d, 0 18px 25px rgba(203,46,93,.32);
    }

    .button:active {
      transform: translateY(7px);
      box-shadow: 0 3px 0 #cb2e5d, 0 9px 18px rgba(203,46,93,.26);
    }

    .hidden { display: none; }

    #countdownCircle {
      position: absolute;
      left: 50%;
      top: 12vh;
      transform: translateX(-50%);
      width: 118px;
      height: 118px;
      border-radius: 50%;
      background: rgba(255,255,255,.94);
      border: 7px solid #fff;
      color: #ff5f8f;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(42px, 5vw, 68px);
      font-weight: 900;
      box-shadow: 0 12px 0 rgba(0,0,0,.16), 0 18px 30px rgba(0,0,0,.22);
      z-index: 12;
    }

    #countdownCircle.warning {
      animation: warningPulse .45s ease infinite alternate;
    }

    @keyframes warningPulse {
      from { transform: translateX(-50%) scale(1); }
      to { transform: translateX(-50%) scale(1.08); }
    }

    @media (max-width: 820px) {
      .hud {
        grid-template-columns: 1fr 1fr;
      }
      .title-panel {
        grid-column: 1 / -1;
        grid-row: 1;
      }
      .panel:first-child { grid-column: 1; grid-row: 2; }
      .panel:last-child { grid-column: 2; grid-row: 2; }
      .question-card {
        top: 24vh;
        min-height: 150px;
        padding: 24px 28px;
      }
      #feedback {
        top: calc(24vh + 170px);
      }
      .answers {
        gap: 14px;
        bottom: 24px;
      }
      .answer-btn {
        min-height: 118px;
        border-radius: 28px;
      }
      #rocketWrap {
        left: 2vw;
        transform: scale(.78);
        transform-origin: bottom left;
      }
      .moon { width: 82px; height: 82px; }
      .moon::after { width: 72px; height: 72px; }
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="stars" id="stars"></div>
    <div class="moon"></div>
    <div class="planet one"></div>
    <div class="planet two"></div>

    <div class="hud">
      <div class="panel">⭐ 分数：<span id="score">0</span></div>
      <div class="panel title-panel">六一知识小火箭</div>
      <div class="panel">🚀 第 <span id="questionNo">1</span> / <span id="totalNo">10</span> 题</div>
    </div>

    <main id="mainStage">
      <div id="countdownCircle">20</div>
      <div id="questionCard" class="question-card">准备发射！</div>
      <div id="feedback"></div>
      <div id="rocketWrap">
        <div class="rocket">
          <div class="flame"></div>
          <div class="fin left"></div>
          <div class="fin right"></div>
          <div class="rocket-body"></div>
          <div class="rocket-nose"></div>
          <div class="window"></div>
        </div>
      </div>
      <div class="answers">
        <button class="answer-btn" data-index="0"><span class="key-label">1</span><span class="answer-text">答案一</span></button>
        <button class="answer-btn" data-index="1"><span class="key-label">2</span><span class="answer-text">答案二</span></button>
        <button class="answer-btn" data-index="2"><span class="key-label">3</span><span class="answer-text">答案三</span></button>
      </div>
    </main>

    <section id="startScreen" class="screen">
      <div class="card">
        <h1 class="big-title">六一知识小火箭</h1>
        <p class="subtitle">答对题目，小火箭就会飞得更高！<br>包含 100 以内加减法、语文、常识和趣味题。</p>
        <div class="tip">操作：按键盘 1、2、3 选择答案</div><br>
        <button id="startBtn" class="button">开始挑战</button>
      </div>
    </section>

    <section id="endScreen" class="screen hidden">
      <div class="card">
        <h1 class="big-title">挑战完成！</h1>
        <p id="finalText" class="subtitle">你获得了 0 分！</p>
        <button id="restartBtn" class="button">再玩一次</button>
      </div>
    </section>
  </div>

  <script>
    const TOTAL_QUESTIONS = 10;
    const QUESTION_TIME = 20;
    const MATH_COUNT = 5;
    const CHINESE_COUNT = 2;
    const COMMON_COUNT = 2;
    const FUN_COUNT = 1;

    const game = document.getElementById('game');
    const starsEl = document.getElementById('stars');
    const scoreEl = document.getElementById('score');
    const questionNoEl = document.getElementById('questionNo');
    const totalNoEl = document.getElementById('totalNo');
    const countdownCircle = document.getElementById('countdownCircle');
    const questionCard = document.getElementById('questionCard');
    const feedback = document.getElementById('feedback');
    const rocketWrap = document.getElementById('rocketWrap');
    const answerButtons = Array.from(document.querySelectorAll('.answer-btn'));
    const startScreen = document.getElementById('startScreen');
    const endScreen = document.getElementById('endScreen');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const finalText = document.getElementById('finalText');

    totalNoEl.textContent = TOTAL_QUESTIONS;

    const chineseBank = [
      { q: '“大”的反义词是什么？', a: '小', opts: ['小', '多', '高'] },
      { q: '下面哪个是水果？', a: '苹果', opts: ['苹果', '铅笔', '桌子'] },
      { q: '哪个字表示太阳？', a: '日', opts: ['日', '月', '山'] },
      { q: '“上”的反义词是什么？', a: '下', opts: ['下', '左', '白'] },
      { q: '下面哪个是动物？', a: '小猫', opts: ['小猫', '书包', '尺子'] },
      { q: '“开”的反义词是什么？', a: '关', opts: ['关', '走', '看'] },
      { q: '哪个字和水有关？', a: '河', opts: ['河', '木', '火'] },
      { q: '“早上好”常用在什么时候？', a: '早晨', opts: ['早晨', '晚上', '半夜'] },
      { q: '下面哪个是学习用品？', a: '橡皮', opts: ['橡皮', '香蕉', '皮球'] },
      { q: '“多”的反义词是什么？', a: '少', opts: ['少', '快', '圆'] },
      { q: '哪个词表示颜色？', a: '红色', opts: ['红色', '跑步', '唱歌'] },
      { q: '“小鸟”会做什么？', a: '飞', opts: ['飞', '游泳', '开车'] },
      { q: '下面哪个是交通工具？', a: '汽车', opts: ['汽车', '西瓜', '铅笔'] },
      { q: '“好朋友”应该怎样相处？', a: '互相帮助', opts: ['互相帮助', '抢玩具', '不说话'] },
      { q: '哪个字表示月亮？', a: '月', opts: ['月', '日', '田'] },
      { q: '“左”的反义词是什么？', a: '右', opts: ['右', '前', '大'] }
    ];

    const commonBank = [
      { q: '红灯亮了，我们应该怎么做？', a: '停下', opts: ['停下', '快跑', '跳起来'] },
      { q: '过马路要走哪里？', a: '斑马线', opts: ['斑马线', '草地', '水里'] },
      { q: '吃饭前应该先做什么？', a: '洗手', opts: ['洗手', '睡觉', '跑步'] },
      { q: '下雨天出门常带什么？', a: '雨伞', opts: ['雨伞', '风筝', '泳圈'] },
      { q: '看到垃圾应该放到哪里？', a: '垃圾桶', opts: ['垃圾桶', '课桌上', '地上'] },
      { q: '牙齿要经常做什么？', a: '刷牙', opts: ['刷牙', '涂颜色', '拍球'] },
      { q: '上课时想发言应该先做什么？', a: '举手', opts: ['举手', '大喊', '离开座位'] },
      { q: '水龙头用完后要怎样？', a: '关紧', opts: ['关紧', '一直开着', '踢一下'] },
      { q: '陌生人给糖果，应该怎么办？', a: '告诉老师或家长', opts: ['告诉老师或家长', '马上拿走', '跟他走'] },
      { q: '眼睛看书要注意什么？', a: '保持距离', opts: ['保持距离', '贴很近', '躺着看'] },
      { q: '火警电话是多少？', a: '119', opts: ['119', '1100', '12345'] },
      { q: '运动前最好先做什么？', a: '热身', opts: ['热身', '吃很多糖', '马上睡觉'] },
      { q: '坐车时要系好什么？', a: '安全带', opts: ['安全带', '红领巾', '鞋带'] },
      { q: '和同学发生小矛盾，要怎么做？', a: '好好说', opts: ['好好说', '打架', '扔东西'] },
      { q: '早睡早起对身体怎么样？', a: '有好处', opts: ['有好处', '没用', '会变懒'] },
      { q: '喝水最好喝什么？', a: '白开水', opts: ['白开水', '很多汽水', '脏水'] }
    ];

    const funBank = [
      { q: '三角形有几条边？', a: '3条', opts: ['3条', '4条', '5条'] },
      { q: '哪个颜色像天空？', a: '蓝色', opts: ['蓝色', '黑色', '棕色'] },
      { q: '六一是什么节日？', a: '儿童节', opts: ['儿童节', '植树节', '国庆节'] },
      { q: '圆形最像下面哪个？', a: '太阳', opts: ['太阳', '书本', '尺子'] },
      { q: '正方形有几条边？', a: '4条', opts: ['4条', '2条', '6条'] },
      { q: '彩虹通常有很多什么？', a: '颜色', opts: ['颜色', '铅笔', '鞋子'] },
      { q: '哪个是冷的？', a: '雪糕', opts: ['雪糕', '热汤', '太阳'] },
      { q: '哪个是会发光的？', a: '星星', opts: ['星星', '石头', '桌子'] },
      { q: '长方形像下面哪个？', a: '门', opts: ['门', '球', '太阳'] },
      { q: '儿童节大家通常会怎样？', a: '开心庆祝', opts: ['开心庆祝', '伤心哭', '不说话'] }
    ];

    const praiseCorrect = ['答对啦！小火箭加速！', '你真聪明！', '知识星星到手！', '太棒啦！继续飞！', '完全正确！'];
    const praiseWrong = ['没关系，继续加油！', '差一点点，下一题会更好！', '认真看答案，再来一次！', '别灰心，小火箭还在前进！'];

    let questions = [];
    let currentIndex = 0;
    let score = 0;
    let correctCount = 0;
    let accepting = false;
    let timeLeft = QUESTION_TIME;
    let timerId = null;
    let audioCtx = null;

    function makeStars() {
      starsEl.innerHTML = '';
      for (let i = 0; i < 70; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.textContent = Math.random() > .72 ? '✦' : '•';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.fontSize = (12 + Math.random() * 22) + 'px';
        star.style.animationDelay = (Math.random() * 3) + 's';
        star.style.animationDuration = (1.6 + Math.random() * 2.4) + 's';
        starsEl.appendChild(star);
      }
    }

    function shuffle(arr) {
      const copy = arr.slice();
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function sample(arr, count) {
      return shuffle(arr).slice(0, count).map(item => ({ ...item, opts: item.opts.slice() }));
    }

    function randInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function makeMathQuestion(level) {
      const isAdd = Math.random() > 0.5;
      let a, b, ans, q;

      if (isAdd) {
        if (level === 'easy') {
          a = randInt(10, 60);
          b = randInt(1, Math.min(30, 100 - a));
          if (Math.random() > .45) b = Math.floor(b / 10) * 10 || 10;
        } else if (level === 'medium') {
          a = randInt(12, 78);
          b = randInt(8, Math.min(45, 100 - a));
        } else {
          a = randInt(26, 84);
          b = randInt(9, Math.min(55, 100 - a));
        }
        ans = a + b;
        q = `${a} + ${b} = ?`;
      } else {
        if (level === 'easy') {
          a = randInt(30, 90);
          b = randInt(1, Math.min(30, a));
          if (Math.random() > .45) b = Math.floor(b / 10) * 10 || 10;
        } else if (level === 'medium') {
          a = randInt(35, 96);
          b = randInt(8, Math.min(55, a));
        } else {
          a = randInt(50, 99);
          b = randInt(16, Math.min(75, a));
        }
        ans = a - b;
        q = `${a} - ${b} = ?`;
      }

      return {
        q,
        a: String(ans),
        opts: makeNumberOptions(ans).map(String),
        type: 'math'
      };
    }

    function makeNumberOptions(ans) {
      const set = new Set([ans]);
      const offsets = shuffle([-20, -15, -12, -10, -9, -8, -6, -5, -4, -3, 3, 4, 5, 6, 8, 9, 10, 12, 15, 20]);
      for (const off of offsets) {
        if (set.size >= 3) break;
        const v = ans + off;
        if (v >= 0 && v <= 100) set.add(v);
      }
      while (set.size < 3) set.add(randInt(0, 100));
      return Array.from(set);
    }

    function prepareQuestions() {
      const math = [
        makeMathQuestion('easy'),
        makeMathQuestion('easy'),
        makeMathQuestion('medium'),
        makeMathQuestion('medium'),
        makeMathQuestion('hard')
      ].slice(0, MATH_COUNT);

      const chinese = sample(chineseBank, CHINESE_COUNT).map(q => ({ ...q, type: 'chinese' }));
      const common = sample(commonBank, COMMON_COUNT).map(q => ({ ...q, type: 'common' }));
      const fun = sample(funBank, FUN_COUNT).map(q => ({ ...q, type: 'fun' }));

      questions = shuffle([...math, ...chinese, ...common, ...fun]).slice(0, TOTAL_QUESTIONS);
      questions.forEach(q => {
        q.opts = shuffle(q.opts);
      });
    }

    function startGame() {
      unlockAudio();
      prepareQuestions();
      currentIndex = 0;
      score = 0;
      correctCount = 0;
      scoreEl.textContent = score;
      startScreen.classList.add('hidden');
      endScreen.classList.add('hidden');
      rocketWrap.style.transform = 'translateY(0)';
      showQuestion();
    }

    function showQuestion() {
      if (currentIndex >= TOTAL_QUESTIONS) {
        endGame();
        return;
      }

      accepting = true;
      clearInterval(timerId);
      timeLeft = QUESTION_TIME;
      countdownCircle.textContent = timeLeft;
      countdownCircle.classList.remove('warning');

      const q = questions[currentIndex];
      questionNoEl.textContent = currentIndex + 1;
      questionCard.textContent = q.q;
      feedback.classList.remove('show');

      answerButtons.forEach((btn, index) => {
        btn.disabled = false;
        btn.classList.remove('correct', 'wrong');
        btn.querySelector('.answer-text').textContent = q.opts[index];
      });

      timerId = setInterval(() => {
        timeLeft--;
        countdownCircle.textContent = timeLeft;
        if (timeLeft <= 5) countdownCircle.classList.add('warning');
        if (timeLeft <= 0) {
          clearInterval(timerId);
          handleTimeout();
        }
      }, 1000);
    }

    function chooseAnswer(index) {
      if (!accepting) return;
      accepting = false;
      clearInterval(timerId);
      countdownCircle.classList.remove('warning');

      const q = questions[currentIndex];
      const picked = q.opts[index];
      const correctIndex = q.opts.indexOf(q.a);
      const isCorrect = picked === q.a;

      answerButtons.forEach(btn => btn.disabled = true);
      answerButtons[correctIndex].classList.add('correct');

      if (isCorrect) {
        correctCount++;
        score += 10 + Math.max(0, timeLeft);
        scoreEl.textContent = score;
        showFeedback(praiseCorrect[Math.floor(Math.random() * praiseCorrect.length)]);
        liftRocket();
        createTrailStars();
        playSound('correct');
      } else {
        answerButtons[index].classList.add('wrong');
        showFeedback(`${praiseWrong[Math.floor(Math.random() * praiseWrong.length)]} 正确答案：${q.a}`);
        shakeRocket();
        playSound('wrong');
      }

      setTimeout(nextQuestion, 1900);
    }

    function handleTimeout() {
      if (!accepting) return;
      accepting = false;
      const q = questions[currentIndex];
      const correctIndex = q.opts.indexOf(q.a);
      answerButtons.forEach(btn => btn.disabled = true);
      answerButtons[correctIndex].classList.add('correct');
      showFeedback(`时间到！正确答案：${q.a}`);
      shakeRocket();
      playSound('timeout');
      setTimeout(nextQuestion, 1900);
    }

    function nextQuestion() {
      currentIndex++;
      showQuestion();
    }

    function liftRocket() {
      const maxLift = Math.min(window.innerHeight * 0.52, 410);
      const lift = (correctCount / TOTAL_QUESTIONS) * maxLift;
      rocketWrap.style.transform = `translateY(${-lift}px)`;
    }

    function shakeRocket() {
      rocketWrap.classList.remove('shake');
      void rocketWrap.offsetWidth;
      rocketWrap.classList.add('shake');
    }

    function showFeedback(text) {
      feedback.textContent = text;
      feedback.classList.remove('show');
      void feedback.offsetWidth;
      feedback.classList.add('show');
    }

    function createTrailStars() {
      const rect = rocketWrap.getBoundingClientRect();
      for (let i = 0; i < 10; i++) {
        const star = document.createElement('div');
        star.className = 'trail-star';
        star.textContent = ['⭐', '✨', '🌟', '💫'][Math.floor(Math.random() * 4)];
        star.style.left = (rect.left + 45 + Math.random() * 50) + 'px';
        star.style.top = (rect.top + 125 + Math.random() * 40) + 'px';
        star.style.animationDelay = (i * .035) + 's';
        game.appendChild(star);
        setTimeout(() => star.remove(), 950);
      }
    }

    function endGame() {
      accepting = false;
      clearInterval(timerId);
      let title = '勇敢小宇航员';
      let emoji = '🚀';
      if (correctCount === 10) { title = '超级知识小火箭'; emoji = '🏆'; }
      else if (correctCount >= 8) { title = '星星探险家'; emoji = '🌟'; }
      else if (correctCount >= 5) { title = '知识小能手'; emoji = '📚'; }

      finalText.innerHTML = `${emoji} 你答对了 <strong style="color:#ff5f8f;font-size:1.25em;">${correctCount}</strong> / ${TOTAL_QUESTIONS} 题！<br>总分：<strong style="color:#ff5f8f;font-size:1.2em;">${score}</strong><br>称号：${title}`;
      endScreen.classList.remove('hidden');
      playSound('end');
    }

    function unlockAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq, start, duration, type = 'sine', volume = .075) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + start);
      gain.gain.setValueAtTime(0, audioCtx.currentTime + start);
      gain.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + start + .01);
      gain.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + start + duration);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + start);
      osc.stop(audioCtx.currentTime + start + duration + .03);
    }

    function playSound(kind) {
      if (!audioCtx) return;
      if (kind === 'correct') {
        playTone(659, 0, .09, 'triangle', .08);
        playTone(880, .08, .12, 'triangle', .08);
        playTone(1175, .18, .15, 'triangle', .08);
      } else if (kind === 'wrong') {
        playTone(260, 0, .14, 'sine', .06);
        playTone(196, .12, .18, 'sine', .05);
      } else if (kind === 'timeout') {
        playTone(392, 0, .13, 'sine', .06);
        playTone(330, .14, .18, 'sine', .05);
      } else if (kind === 'end') {
        playTone(523, 0, .12, 'triangle', .08);
        playTone(659, .12, .12, 'triangle', .08);
        playTone(784, .24, .12, 'triangle', .08);
        playTone(1046, .38, .22, 'triangle', .08);
      }
    }

    answerButtons.forEach((btn, index) => {
      btn.addEventListener('click', () => chooseAnswer(index));
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === '1') chooseAnswer(0);
      if (e.key === '2') chooseAnswer(1);
      if (e.key === '3') chooseAnswer(2);
      if ((e.key === 'Enter' || e.key === ' ') && !startScreen.classList.contains('hidden')) startGame();
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    makeStars();
  </script>
</body>
</html>
