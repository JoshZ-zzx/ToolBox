<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原神祈愿模拟器 · 旧存档迁移</title><style>body{margin:0;background:#edf7f6;color:#173b45;font:16px/1.8 system-ui,sans-serif}main{max-width:680px;margin:8vh auto;padding:28px;background:white;border:1px solid #cee2df;border-radius:24px}button,a{color:#166a75}button{padding:12px 18px;border-radius:12px;background:#eef8f7;border:1px solid #8db9be;cursor:pointer;margin:8px 8px 8px 0}h1{font-size:26px}small{color:#637c81}a{display:inline-block;margin-top:20px}@media(max-width:720px){main{margin:20px}}</style><main><h1>把旧存档带到独立版</h1><p>本页只读取当前域名、当前浏览器中的旧版存档，导出文件供你在新站导入。不会清空旧存档，也不会上传任何数据。</p><div id="saves"></div><p id="status" role="status"></p><small>请使用以前打开模拟器的浏览器访问本页。如果旧版在其他域名运行，需要在那个域名部署本页并访问。旧版只持久保存保底、累计统计和配置，逐抽结果不在迁移范围。</small><br><a href="https://joshz-zzx.github.io/GenshinWishSimulator/">打开独立版 →</a><br><a href="./">返回 ToolBox</a></main><script>
const entries=[['标准 v2','teyvat-wish-single-html-v1'],['图片预览版','teyvat-wish-image-preview-v1']];
for(const [label,key] of entries){const button=document.createElement('button');button.textContent='导出'+label+'存档';button.onclick=()=>{try{const raw=localStorage.getItem(key);if(!raw){document.getElementById('status').textContent=label+'：当前浏览器没有找到存档。请检查域名和浏览器是否与旧版一致。';return;}const data=JSON.parse(raw);if(!data.state||!data.config)throw Error('存档格式异常');const envelope={format:'teyvat-wish-save',version:1,exportedAt:new Date().toISOString(),source:key,data};const url=URL.createObjectURL(new Blob([JSON.stringify(envelope,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download=key+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='已导出'+label+'。请在独立版右上角设置 → “存档与迁移”中导入。';}catch(e){document.getElementById('status').textContent='无法导出：'+e.message;}};document.getElementById('saves').append(button);}
</script></html>
